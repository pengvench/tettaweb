name: Deploy to Beget

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate media manifest
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BEGET_SSH_KEY }}" | tr -d '\r' > ~/.ssh/beget_key
          chmod 600 ~/.ssh/beget_key
          ssh-keyscan -H "${{ secrets.BEGET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy files
        run: |
          rsync -rltvz --omit-dir-times --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".ssh/" \
            --exclude ".cache/" \
            --exclude ".local/" \
            --exclude "node_modules/" \
            --exclude "AWAKE-landing-main/" \
            --exclude "ZBS Production_files/" \
            --exclude "politika_pd_tetta-prod.ru.docx" \
            -e "ssh -i ~/.ssh/beget_key" \
            ./ "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:${{ secrets.BEGET_PATH }}/"
