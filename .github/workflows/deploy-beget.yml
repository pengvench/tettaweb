name: Deploy to Beget

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 */3 * *"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate media and news manifests
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BEGET_SSH_KEY }}" | tr -d '\r' > ~/.ssh/beget_key
          chmod 600 ~/.ssh/beget_key
          ssh-keyscan -H "${{ secrets.BEGET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy files
        run: |
          rsync -rltvz --omit-dir-times --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".ssh/" \
            --exclude ".cache/" \
            --exclude ".local/" \
            --exclude "node_modules/" \
            --exclude "snake-data/" \
            --exclude "AWAKE-landing-main/" \
            --exclude "ZBS Production_files/" \
            --exclude "politika_pd_tetta-prod.ru.docx" \
            --exclude "projects/*.webm" \
            --exclude "projects/reels/" \
            -e "ssh -i ~/.ssh/beget_key" \
            ./ "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:${{ secrets.BEGET_PATH }}/"

      - name: Remove heavy unused videos from server
        run: |
          ssh -i ~/.ssh/beget_key "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" <<'EOF'
          set -eu
          cd "${{ secrets.BEGET_PATH }}"
          # Полные web-версии видео (141 МБ) в корне projects/ и полные reels
          # (76 МБ) не используются: сайт берёт видео из Яндекс-бакета, а
          # фолбэк — только previews/. Чистим, чтобы не тянуть 217МБ по rsync.
          find projects -maxdepth 1 -type f -name "*.webm" -delete
          rm -rf projects/reels
          echo "[deploy] heavy videos removed"
          EOF

      - name: Prepare snake storage
        run: |
          ssh -i ~/.ssh/beget_key "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" <<'EOF'
          set -eu
          SNAKE_DIR="${{ secrets.BEGET_PATH }}/snake-data"
          mkdir -p "$SNAKE_DIR"
          chmod 755 "$SNAKE_DIR"
          cat > "$SNAKE_DIR/.htaccess" <<'HTACCESS'
          Require all denied
          Deny from all
          HTACCESS
          EOF
