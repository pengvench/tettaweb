            letter-spacing: 0.02em;

            max-width: 36rem;
            color: rgba(255,255,255,0.68);
            line-height: 1.55;
        }
        a {
            width: fit-content;
            color: #fff;
            text-transform: uppercase;
            font-weight: 800;
            text-decoration: none;
            border-bottom: 2px solid #0a00ff;
            padding-bottom: 0.25rem;
